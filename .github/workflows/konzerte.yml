# Täglicher Konzertlauf: Daten holen, nach main committen, auf GitHub Pages veröffentlichen.
#
# Branch: Der Workflow arbeitet auf `main`. Lokal heißt der Hauptbranch `master`;
# er wird beim ersten Push als `main` hochgeladen (git push -u origin master:main).
#
# Aufbau mit drei Jobs (ein Job = ein eigener Rechner-Durchlauf):
#   1. daten     Tests, Konzerte abholen, Daten committen, Seite zusammenbauen und als
#                Pages-Artefakt hochladen. Merkt sich den Exit-Code von abholen als Ausgabe.
#   2. deploy    Stellt das Artefakt auf GitHub Pages online. Läuft nur, wenn abholen mit
#                0 (alles gut) oder 1 (eine Quelle ausgefallen, übrige Daten trotzdem
#                geschrieben) endete. Bei 124 (Zeitlimit) oder anderen Codes wird nichts
#                veröffentlicht.
#   3. ergebnis  Läuft immer und macht den ganzen Lauf rot, wenn abholen nicht 0 war.
#                Nötig, weil bei Exit 1 trotzdem veröffentlicht wird: der Job "daten" selbst
#                bleibt grün, damit "deploy" starten darf. So bekommt Mark trotzdem eine
#                Fehler-Mail von GitHub, wenn eine Quelle ausfällt.
name: konzerte

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
    # Der Bot-Commit ändert nur data/; ohne diese Zeile würde er den Workflow erneut starten.
    # (Ein Push mit dem GITHUB_TOKEN löst ohnehin keinen weiteren Workflow aus; doppelt hält besser.)
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

# Standard: nur lesen. Die Jobs bekommen unten genau die Rechte, die sie brauchen.
permissions:
  contents: read

# Geplanter Lauf und Push-Lauf dürfen nicht gleichzeitig committen.
# Ein laufender Lauf wird nicht abgebrochen, der nächste wartet.
concurrency:
  group: konzerte
  cancel-in-progress: false

jobs:
  daten:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # für den Daten-Commit nach main
      pages: write      # configure-pages liest/prüft die Pages-Einstellung
    outputs:
      abholen_code: ${{ steps.abholen.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Immer der aktuelle main-Stand, auch wenn der Lauf hinter concurrency gewartet hat.
          ref: main

      - name: Werkzeuge prüfen
        run: |
          python3 --version
          node --version

      - name: Python-Tests
        run: python3 -m unittest discover -s tools/konzerte/tests -t .

      - name: JS-Tests
        run: |
          node --version
          # Ohne Anführungszeichen: die Shell expandiert das Muster (Node 20 kann es nicht selbst).
          node --test tests/js/*.test.mjs

      # abholen schreibt bei Ausfall einer Quelle die übrigen Daten trotzdem (Exit 1).
      # Exit 1 kommt auch bei einer unbehandelten Exception; dann liegt noch der alte, gültige
      # Stand vor (atomares Schreiben) und wird unverändert veröffentlicht, was harmlos ist.
      # Darum merkt dieser Schritt nur den Exit-Code; committet und veröffentlicht wird
      # danach, und der Job "ergebnis" beendet den Lauf mit dem gemerkten Code.
      # (abholen hat ein eigenes Zeitbudget von 420 s; timeout 540 ist nur das Sicherheitsnetz.)
      - name: Konzerte abholen
        id: abholen
        run: |
          set +e
          timeout 540 python3 -m tools.konzerte.abholen
          code=$?
          set -e
          echo "abholen: Exit-Code $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Nur bei Exit 0 oder 1. Ein Timeout (124) oder ein Absturz veröffentlicht nichts.
      - name: Daten nach main committen
        if: (steps.abholen.outputs.code == '0' || steps.abholen.outputs.code == '1') && github.ref_name == 'main'
        run: |
          if [ -z "$(git status --porcelain -- 'data/*.json')" ]; then
            echo "Keine Änderung an data/*.json, kein Commit."
            exit 0
          fi
          git config user.name "konzerte-bot"
          git config user.email "konzerte-bot@users.noreply.github.com"
          git add -- data/*.json
          git commit -m "Konzertdaten aktualisiert $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:main

      # Die Seite wird in einen frischen, leeren Ordner außerhalb des Repos gebaut
      # (veroeffentlichen.sh weigert sich, ins eigene Repo zu schreiben).
      # Bricht ab, solange in den Rechtstexten noch "[bitte ausfüllen]" steht.
      - name: Seite zusammenbauen
        if: (steps.abholen.outputs.code == '0' || steps.abholen.outputs.code == '1') && github.ref_name == 'main'
        run: |
          mkdir "$RUNNER_TEMP/seite"
          bash tools/veroeffentlichen.sh "$RUNNER_TEMP/seite"

      - name: Pages einrichten
        if: (steps.abholen.outputs.code == '0' || steps.abholen.outputs.code == '1') && github.ref_name == 'main'
        uses: actions/configure-pages@v5

      - name: Pages-Artefakt hochladen
        if: (steps.abholen.outputs.code == '0' || steps.abholen.outputs.code == '1') && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/seite

  deploy:
    needs: daten
    if: (needs.daten.outputs.abholen_code == '0' || needs.daten.outputs.abholen_code == '1') && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Pages-Deployment auslösen
      id-token: write   # Nachweis, dass das Deployment aus diesem Lauf kommt
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

  # Läuft immer: bei gemerktem Fehlercode (1 = Quelle ausgefallen, 124 = Zeitlimit) wird der Lauf rot.
  ergebnis:
    needs: [daten, deploy]
    if: always() && needs.daten.outputs.abholen_code != '' && needs.daten.outputs.abholen_code != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis von abholen auswerten
        env:
          ABHOLEN_CODE: ${{ needs.daten.outputs.abholen_code }}
        run: |
          echo "abholen endete mit Exit-Code $ABHOLEN_CODE (1 = Quelle ausgefallen, 124 = Zeitlimit)." >&2
          exit "$ABHOLEN_CODE"
